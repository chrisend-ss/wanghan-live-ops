name: Bilibili Cloud Review

on:
  push:
    paths:
      - "review_requests/*.json"
  workflow_dispatch:
    inputs:
      request:
        description: Review request JSON path
        required: true
        default: review_requests/2026-09-29_BV1xNas6ZEpB_precise_v2_1.json

permissions:
  contents: write

# Review jobs write deterministic paths under reviews/<date>_<bvid>.
# Serialize runs so duplicate/retry requests cannot race and conflict.
concurrency:
  group: wanghan-bilibili-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      RESULTS_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}-small-v1
          restore-keys: |
            whisper-${{ runner.os }}-

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-transcribe.txt

      - name: Test Precision V2.1 gates
        run: python -m unittest discover -s tests -v

      - name: Install Chromium for Bilibili browser fallback
        run: |
          python -m playwright install --with-deps chromium

      - name: Find review requests
        id: requests
        shell: bash
        env:
          REQUEST_PATH: ${{ inputs.request }}
        run: |
          set -u
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [[ ! "$REQUEST_PATH" =~ ^review_requests/[A-Za-z0-9_-]+\.json$ ]] || [ ! -f "$REQUEST_PATH" ]; then
              echo "Invalid review request path"
              exit 1
            fi
            FILES="$REQUEST_PATH"
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              FILES=$(git diff --name-only HEAD^ HEAD -- 'review_requests/*.json')
            else
              FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'review_requests/*.json' || true)
            fi
          fi

          echo "Request files:"
          printf '%s\n' "$FILES"

          {
            echo "files<<EOF"
            printf '%s\n' "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Process Bilibili requests
        id: process
        continue-on-error: true
        shell: bash
        run: |
          set +e
          FAILED=0
          while IFS= read -r req; do
            [ -z "$req" ] && continue
            echo "=== Processing $req ==="
            xvfb-run -a python tools/cloud_bilibili_review.py --request "$req"
            CODE=$?
            if [ $CODE -ne 0 ]; then
              FAILED=1
            fi
          done <<'EOF'
          ${{ steps.requests.outputs.files }}
          EOF
          exit $FAILED

      - name: Commit text-only review results
        if: always()
        shell: bash
        run: |
          git config user.name "wanghan-live-ops-bot"
          git config user.email "wanghan-live-ops-bot@users.noreply.github.com"
          if [ -d reviews ]; then
            UNEXPECTED=$(find reviews -type f ! -name '*.md' ! -name '*.json' ! -name '*.jsonl')
            if [ -n "$UNEXPECTED" ]; then
              echo "Refusing to commit non-text review files."
              exit 1
            fi
            git add reviews/
          else
            echo "No reviews directory was produced."
          fi
          if git diff --cached --quiet; then
            echo "No review outputs to commit."
          else
            git commit -m "data: add Bilibili review transcript"

            # Multiple transcription jobs may finish at nearly the same time.
            # Rebase onto the requested branch before pushing so independent review
            # folders do not fail with a non-fast-forward race.
            PUSHED=0
            for attempt in 1 2 3 4; do
              echo "Push attempt $attempt"
              if git pull --rebase origin "$RESULTS_BRANCH" && git push origin "HEAD:$RESULTS_BRANCH"; then
                PUSHED=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done

            if [ "$PUSHED" -ne 1 ]; then
              echo "Failed to publish review outputs after retries."
              exit 1
            fi
          fi

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanghan-bilibili-review-${{ github.run_id }}
          path: |
            reviews/**/*.md
            reviews/**/*.json
            reviews/**/*.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Mark workflow failed when transcription failed
        if: steps.process.outcome == 'failure'
        run: exit 1

