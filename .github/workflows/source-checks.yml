name: Source acquisition checks
on:
  push:
    paths:
      - "app/bilibili*.py"
      - "tools/cloud_bilibili_review.py"
      - "skills/wanghan-core-ops/scripts/**"
      - "tests/test_source_acquisition.py"
      - ".github/workflows/source-checks.yml"
  pull_request:
    paths:
      - "app/bilibili*.py"
      - "tools/cloud_bilibili_review.py"
      - "skills/wanghan-core-ops/scripts/**"
      - "tests/test_source_acquisition.py"
      - ".github/workflows/source-checks.yml"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.5
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app/bilibili.py app/bilibili_browser.py tools/cloud_bilibili_review.py skills/wanghan-core-ops/scripts
